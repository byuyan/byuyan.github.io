name: nest-sync-14

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nest-sync-14.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download site bundle
        run: |
          curl -fL --retry 3 -o /tmp/nest-site7.zip "https://aka.doubaocdn.com/s/1HVcBPUkNf"
          ls -l /tmp/nest-site7.zip

      - name: Unpack into nest/
        run: |
          mkdir -p nest
          unzip -o /tmp/nest-site7.zip -d nest

      - name: Commit and push
        run: |
          git config user.name "nest-bot"
          git config user.email "byuyan@users.noreply.github.com"
          git add -A nest
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "chore(nest): sync l2 - 介绍页首屏整理"
          git push origin main
