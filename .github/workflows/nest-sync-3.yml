name: nest-sync-3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/nest-sync-3.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack nest site
        run: |
          curl -fsSL -o /tmp/site.zip "https://aka.doubaocdn.com/s/dMgAlWBAl5"
          unzip -o /tmp/site.zip -d nest
          ls -la nest nest/assets/css

      - name: Commit
        run: |
          git config user.name "nest-bot"
          git config user.email "byuyan@qq.com"
          git add nest
          if ! git diff --staged --quiet; then
            git commit -m "feat: multi-direction floating particles"
            git push
          else
            echo "nothing to commit"
          fi
