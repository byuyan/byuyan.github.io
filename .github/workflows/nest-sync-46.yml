name: nest sync 46
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nest-sync-46.yml"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patch bundle
        run: curl -fsSL "https://aka.doubaocdn.com/s/x5Duvsv6DB" -o /tmp/nest.zip && ls -l /tmp/nest.zip
      - name: unzip into repo
        run: unzip -o /tmp/nest.zip -d . && find nest/about-site -maxdepth 2 -name "admin.html" -o -maxdepth 2 -name "index.html"
      - name: commit if changed
        run: |
          git config user.name "byuyan"
          git config user.email "byuyan@qq.com"
          git add -A nest
          if git diff --cached --quiet; then
            echo "no change to commit"
          else
            git commit -m "nest: add works admin page and intro entry"
            git push
          fi
