name: nest-sync

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/nest-sync.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack nest site
        run: |
          mkdir -p nest
          curl -fsSL -o /tmp/site.zip "https://aka.doubaocdn.com/s/hgUZfvvdS7"
          unzip -o /tmp/site.zip -d nest
          ls -la nest nest/assets nest/assets/img

      - name: Commit
        run: |
          git config user.name "nest-bot"
          git config user.email "byuyan@qq.com"
          git add nest
          if ! git diff --staged --quiet; then
            git commit -m "chore: add nest site under /nest"
            git push
          else
            echo "nothing to commit"
          fi
