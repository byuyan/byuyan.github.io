name: look-toggle

# 一次性任务：打开角色模型的眼镜 / 贴纸 / 腮红开关
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/look-toggle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  toggle:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Flip LOOK flags
        run: |
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("assets/js/character.js")
          text = p.read_text(encoding="utf-8")
          for key in ("glasses", "stickers", "blush"):
              text, n = re.subn(rf"{key}:\s*false", f"{key}: true", text)
              print(key, "-> true", n)
          p.write_text(text, encoding="utf-8")
          PY
          grep -n "glasses:\|stickers:\|blush:" assets/js/character.js | head -5

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/character.js
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "style: enable glasses, face stickers and blush on hero character"
            git pull --rebase origin main || true
            git push
          fi
