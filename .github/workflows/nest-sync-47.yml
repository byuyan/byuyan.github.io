name: nest sync 47
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nest-sync-47.yml"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch patch bundle
        run: curl -fsSL "https://aka.doubaocdn.com/s/ZMwmYLhpk8" -o /tmp/nest.zip && ls -l /tmp/nest.zip
      - name: unzip into repo
        run: unzip -o /tmp/nest.zip -d . && grep -c "nav__item" nest/index.html
      - name: commit if changed
        run: |
          git config user.name "byuyan"
          git config user.email "byuyan@qq.com"
          git add -A nest
          if git diff --cached --quiet; then
            echo "no change to commit"
          else
            git commit -m "nest: add admin entry to home nav"
            git push
          fi
