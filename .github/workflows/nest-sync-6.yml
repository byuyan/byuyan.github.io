name: nest sync 6

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/nest-sync-6.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: pull package
        run: |
          curl -L --fail -o /tmp/nest.zip "https://aka.doubaocdn.com/s/vVmoUiplod"
          unzip -o /tmp/nest.zip -d nest
          ls -la nest
      - name: commit nest
        run: |
          git config user.name "byuyan"
          git config user.email "byuyan@users.noreply.github.com"
          git add -A nest
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "chore: sync nest site (v20261108f)"
            git push
          fi
