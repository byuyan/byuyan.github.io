name: nest sync 20

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nest-sync-20.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch zip
        run: curl -fL -o /tmp/nest.zip "https://aka.doubaocdn.com/s/xnhZOSazsf"
      - name: unzip
        run: unzip -o /tmp/nest.zip -d nest
      - name: commit
        run: |
          git config user.name "nest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A nest
          if ! git diff --cached --quiet; then
            git commit -m "nest: liquid orb assistant button (20261108q)"
            git push
          else
            echo "no changes"
          fi
