name: nest sync 36

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nest-sync-36.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download patch
        run: curl -fsSL -o /tmp/p.zip https://aka.doubaocdn.com/s/dyhRb7EhFk
      - name: unpack
        run: unzip -o /tmp/p.zip -d .
      - name: commit
        run: |
          git config user.email byuyan@qq.com
          git config user.name byuyan
          git add -A nest
          if git diff --cached --quiet; then echo "no change"; else git commit -m "nest: intro embed + drop home works (20261108z7)"; git push; fi
