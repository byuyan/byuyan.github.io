name: nest sync 23

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nest-sync-23.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch zip
        run: curl -fL --retry 3 -o /tmp/p.zip "https://aka.doubaocdn.com/s/ltykMDJALm"
      - name: unzip
        run: unzip -o /tmp/p.zip -d .
      - name: commit
        run: |
          git config user.name "nest-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A nest
          if ! git diff --cached --quiet; then
            git commit -m "nest: real CC0 piano tracks in the record player (20261108t)"
            git push
          else
            echo "no changes"
          fi
