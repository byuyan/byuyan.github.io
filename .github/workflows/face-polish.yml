name: face-polish

# 一次性任务：微调角色面部（眼睛前移、镜架前移、腮红与贴纸位置）并刷新缓存参数
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/face-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Adjust face geometry
        run: |
          python3 - <<'PY'
          import pathlib
          c = pathlib.Path("assets/js/character.js")
          t = c.read_text(encoding="utf-8")

          reps = [
              ("eye.position.set(side * 0.38, 0.12, 0.955);",
               "eye.position.set(side * 0.38, 0.12, 0.995);"),
              ("glasses.position.set(0, 0.11, 1.0);",
               "glasses.position.set(0, 0.1, 1.035);"),
              ("new THREE.PlaneGeometry(0.4, 0.26), blushMat",
               "new THREE.PlaneGeometry(0.46, 0.3), blushMat"),
              ("blush.position.set(side * 0.55, -0.17, 0.83);",
               "blush.position.set(side * 0.53, -0.25, 0.86);"),
              ("new THREE.Vector3(-0.64, -0.19, 0.78),",
               "new THREE.Vector3(-0.58, -0.33, 0.80),"),
              ("new THREE.Vector3(0.58, -0.37, 0.72),",
               "new THREE.Vector3(0.56, -0.34, 0.78),"),
          ]
          for old, new in reps:
              if old not in t:
                  print("MISS:", old)
              t = t.replace(old, new)
          c.write_text(t, encoding="utf-8")

          h = pathlib.Path("index.html")
          s = h.read_text(encoding="utf-8")
          s = s.replace("character.js?v=20261107b", "character.js?v=20261107c")
          h.write_text(s, encoding="utf-8")
          print("done")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/js/character.js index.html
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "style: refine glasses, eyes, blush and sticker placement"
            git pull --rebase origin main || true
            git push
          fi
