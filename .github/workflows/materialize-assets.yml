name: materialize-assets

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download assets
        run: |
          set -euo pipefail
          mkdir -p assets/css assets/js assets/vendor assets/img
          curl -fsSL --retry 4 -o assets/css/tokens.css  https://aka.doubaocdn.com/s/mOavGPJLWB
          curl -fsSL --retry 4 -o assets/css/style.css   https://aka.doubaocdn.com/s/NmpyUD8mUg
          curl -fsSL --retry 4 -o assets/js/store.js     https://aka.doubaocdn.com/s/fqd7WKCO76
          curl -fsSL --retry 4 -o assets/js/character.js https://aka.doubaocdn.com/s/wVxhyxVbEK
          curl -fsSL --retry 4 -o assets/js/content.js   https://aka.doubaocdn.com/s/YlQZ9Nxw4I
          curl -fsSL --retry 4 -o assets/js/site.js      https://aka.doubaocdn.com/s/l4tb2kdbVq
          curl -fsSL --retry 4 -o assets/vendor/three.min.js https://aka.doubaocdn.com/s/UnTG4jEqBo
          curl -fsSL --retry 4 -o assets/img/portrait.png https://aka.doubaocdn.com/s/XCKffTYRZ6
          curl -fsSL --retry 4 -o assets/img/me.jpg       https://aka.doubaocdn.com/s/y3OGFqnRcJ
          curl -fsSL --retry 4 -o assets/img/favicon.svg  https://aka.doubaocdn.com/s/nOVJvPppH1
          curl -fsSL --retry 4 -o assets/img/project-nocturne.svg   https://aka.doubaocdn.com/s/oxtVIdVVsU
          curl -fsSL --retry 4 -o assets/img/project-price.svg      https://aka.doubaocdn.com/s/J35DBsXcjf
          curl -fsSL --retry 4 -o assets/img/project-echoes.svg     https://aka.doubaocdn.com/s/jr36hu6YB9
          curl -fsSL --retry 4 -o assets/img/project-studymate.svg  https://aka.doubaocdn.com/s/vwaFcerE1h

      - name: Rewrite CDN links to local paths
        run: |
          python3 - <<'PY'
          import pathlib

          mapping = {
              "https://aka.doubaocdn.com/s/mOavGPJLWB": "assets/css/tokens.css",
              "https://aka.doubaocdn.com/s/NmpyUD8mUg": "assets/css/style.css",
              "https://aka.doubaocdn.com/s/fqd7WKCO76": "assets/js/store.js",
              "https://aka.doubaocdn.com/s/wVxhyxVbEK": "assets/js/character.js",
              "https://aka.doubaocdn.com/s/YlQZ9Nxw4I": "assets/js/content.js",
              "https://aka.doubaocdn.com/s/l4tb2kdbVq": "assets/js/site.js",
              "https://aka.doubaocdn.com/s/UnTG4jEqBo": "assets/vendor/three.min.js",
              "https://aka.doubaocdn.com/s/XCKffTYRZ6": "assets/img/portrait.png",
              "https://aka.doubaocdn.com/s/y3OGFqnRcJ": "assets/img/me.jpg",
              "https://aka.doubaocdn.com/s/nOVJvPppH1": "assets/img/favicon.svg",
              "https://aka.doubaocdn.com/s/oxtVIdVVsU": "assets/img/project-nocturne.svg",
              "https://aka.doubaocdn.com/s/J35DBsXcjf": "assets/img/project-price.svg",
              "https://aka.doubaocdn.com/s/jr36hu6YB9": "assets/img/project-echoes.svg",
              "https://aka.doubaocdn.com/s/vwaFcerE1h": "assets/img/project-studymate.svg",
          }

          targets = list(pathlib.Path(".").glob("*.html"))
          targets += list(pathlib.Path("assets/js").glob("*.js"))
          targets += list(pathlib.Path("admin").glob("*")) if pathlib.Path("admin").exists() else []

          for path in targets:
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              original = text
              for remote, local in mapping.items():
                  text = text.replace(remote, local)
              if text != original:
                  path.write_text(text, encoding="utf-8")
                  print("rewritten", path)
          PY

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: materialize assets"
            git push
          fi
