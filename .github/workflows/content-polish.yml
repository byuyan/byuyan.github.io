name: content-polish

# 一次性任务：统一替换站点里的示例身份信息（可重复执行，幂等）
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/content-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply identity strings
        run: |
          python3 - <<'PY'
          import pathlib

          pairs = [
              ("林知远", "郑宇彬"),
              ("LIN ZHIYUAN", "ZHENG YUBIN"),
              ("Lin Zhiyuan", "Zheng Yubin"),
              ("hello@linzhiyuan.me", "hello@example.com"),
              ("zhiyuan-lin", "byuyan"),
              ("南山大学", "武汉理工大学"),
              ("杭州", "武汉"),
              ("HANGZHOU", "WUHAN"),
              (">知<", ">郑<"),
              (">林<", ">郑<"),
          ]

          files = [
              "index.html",
              "admin/index.html",
              "assets/js/content.js",
              "assets/js/site.js",
              "assets/js/store.js",
              "admin/admin.js",
              "README.md",
          ]

          for name in files:
              p = pathlib.Path(name)
              if not p.is_file():
                  continue
              text = p.read_text(encoding="utf-8")
              changed = 0
              for old, new in pairs:
                  if old in text:
                      changed += text.count(old)
                      text = text.replace(old, new)
              if changed:
                  p.write_text(text, encoding="utf-8")
              print(f"{name}: {changed} local replacements")

          page = pathlib.Path("index.html")
          html = page.read_text(encoding="utf-8")
          if "inline-edit.js" not in html:
              tag = (
                  '  <link rel="stylesheet" href="assets/css/inline-edit.css?v=20261107">\n'
                  '  <script src="assets/js/inline-edit.js?v=20261107"></script>\n'
              )
              page.write_text(html.replace("</body>", tag + "</body>"), encoding="utf-8")
              print("editor re-injected")
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "content: finish identity replacement"
            git pull --rebase origin main || true
            git push
          fi
