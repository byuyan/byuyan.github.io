name: nest-sync-15

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/nest-sync-15.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download
        run: curl -fL --retry 3 -o /tmp/nest.zip "https://aka.doubaocdn.com/s/1HVcBPUkNf"
      - name: Unpack
        run: unzip -o /tmp/nest.zip -d nest
      - name: Push
        run: |
          git config user.name "nest-bot"
          git config user.email "byuyan@users.noreply.github.com"
          git add -A nest
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "chore(nest): sync l2 - 首屏布局整理"
          git push origin main
