<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
    </filter>
    <clipPath id="arch">
      <path d="M700 760V430c0-118 88-206 200-206s200 88 200 206v330z"/>
    </clipPath>
  </defs>

  <rect width="1200" height="900" fill="#df6249"/>
  <g fill="#f3e7d6" opacity="0.92">
    <path d="M0 760V520c0-140 110-250 250-250s250 110 250 250v240z"/>
    <path d="M240 900V700c0-95 76-170 170-170s170 75 170 170v200z" opacity="0.5"/>
  </g>

  <g clip-path="url(#arch)">
    <rect x="700" y="224" width="400" height="536" fill="#20211a"/>
    <g stroke="#df6249" stroke-opacity="0.7" fill="none">
      <path d="M740 700c40-70 20-140 60-210s60-150 60-230"/>
      <path d="M790 700c40-70 20-140 60-210s60-150 60-230" stroke-opacity="0.45"/>
      <path d="M840 700c40-70 20-140 60-210s60-150 60-230" stroke-opacity="0.25"/>
    </g>
    <circle cx="900" cy="470" r="42" fill="#f3e7d6" opacity="0.9"/>
    <path d="M900 428a42 42 0 0 1 0 84" fill="#df6249" opacity="0.55"/>
  </g>

  <g fill="#20211a" font-family="Cascadia Code, Consolas, monospace" font-size="18" letter-spacing="4">
    <text x="80" y="110">ECHOES / 2025</text>
    <text x="80" y="140" opacity="0.5">5 ARTISANS · 1 DIGITAL ARCHIVE</text>
  </g>

  <text x="80" y="380" fill="#fbf9f4" font-family="Noto Serif SC, Songti SC, serif" font-size="120" font-weight="600">非遗</text>
  <text x="80" y="500" fill="#fbf9f4" font-family="Noto Serif SC, Songti SC, serif" font-size="120" font-weight="600">新声</text>
  <text x="86" y="570" fill="#20211a" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="24" letter-spacing="4">让手艺，用自己的声音被听见。</text>

  <g transform="translate(80 700)" stroke="#20211a" stroke-opacity="0.6">
    <path d="M0 0v60M22 0v60M44 0v60M66 0v60M88 0v60M110 0v60" stroke-width="2"/>
    <text x="0" y="105" fill="#20211a" font-family="Cascadia Code, Consolas, monospace" font-size="13">SCROLL TO LISTEN</text>
  </g>

  <rect width="1200" height="900" filter="url(#grain)" opacity="0.6"/>
</svg>
