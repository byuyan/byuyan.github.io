<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1220'/%3E%3Ctext x='32' y='43' font-size='30' text-anchor='middle' fill='%238aa8ff' font-family='sans-serif'%3EN%3C/text%3E%3C/svg%3E">
<style>
html,body{margin:0;height:100%;background:#05070c;overflow:hidden}
.me-frame{
  position:fixed;inset:0;width:100%;height:100%;border:0;
  background:#f4f1e6;
}
.me-chip{
  position:fixed;left:18px;bottom:18px;z-index:50;
  display:inline-flex;align-items:center;gap:8px;
  padding:11px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.16);
  background:rgba(12,10,8,.72);backdrop-filter:blur(14px);
  color:#f6f1e4;text-decoration:none;
  font:500 13px/1 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  letter-spacing:.02em;transition:transform .18s ease,background .18s ease,opacity .18s ease;
  opacity:.86;
}
.me-chip:hover{transform:translateY(-2px);background:rgba(12,10,8,.9);opacity:1}
.me-chip i{
  width:6px;height:6px;border-radius:50%;background:#8aa8ff;flex:none;
  box-shadow:0 0 10px rgba(138,168,255,.8)
}
@media (max-width:520px){
  .me-chip{left:12px;bottom:12px;padding:10px 15px;font-size:12px}
}
</style>
</head>
<body>

<iframe class="me-frame" id="me-frame" src="about-site/index.html" title="郑宇彬的个人介绍" allow="fullscreen"></iframe>

<a class="me-chip" href="index.html"><i></i>回小窝</a>

<script>
  // 内嵌整页时补两处矮视口布局修正：
  // 1) 首屏给一个高度下限，底部状态块不再压住按钮；
  // 2) 左下「向下滚动 / SCROLL」与状态块在矮窗口会叠字，整块收掉。
  (function () {
    var frame = document.getElementById("me-frame");
    if (!frame) return;
    var PATCH = [
      ".hero{min-height:max(100svh,900px)}",
      ".hero__foot{display:none}"
    ].join("\n");
    function apply() {
      try {
        var doc = frame.contentDocument;
        if (!doc || !doc.head) return;
        if (doc.getElementById("me-viewport-patch")) return;
        var style = doc.createElement("style");
        style.id = "me-viewport-patch";
        style.textContent = PATCH;
        doc.head.appendChild(style);
      } catch (e) { /* 跨域或未加载完，忽略 */ }
    }
    frame.addEventListener("load", apply);
    apply();
  })();
</script>

</body>
