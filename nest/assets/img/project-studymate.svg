<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
  <defs>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#2a3a24" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#a8b8a0"/>
  <g fill="#20211a" opacity="0.18">
    <circle cx="120" cy="120" r="2"/><circle cx="180" cy="120" r="2"/><circle cx="240" cy="120" r="2"/>
    <circle cx="120" cy="180" r="2"/><circle cx="180" cy="180" r="2"/><circle cx="240" cy="180" r="2"/>
    <circle cx="120" cy="240" r="2"/><circle cx="180" cy="240" r="2"/><circle cx="240" cy="240" r="2"/>
  </g>

  <g font-family="Cascadia Code, Consolas, monospace" fill="#20211a" letter-spacing="4">
    <text x="80" y="110" font-size="18">STUDYMATE / 2025</text>
    <text x="80" y="140" font-size="15" opacity="0.5">A TINY PRODUCT ABOUT ASKING</text>
  </g>

  <text x="80" y="280" fill="#20211a" font-family="Noto Serif SC, Songti SC, serif" font-size="92" font-weight="600">自习搭子</text>
  <text x="84" y="330" fill="#2d3c28" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="22" letter-spacing="3">删掉打卡与排名，只留下一句邀请。</text>

  <g filter="url(#shadow)">
    <path d="M180 460h520a40 40 0 0 1 40 40v150a40 40 0 0 1-40 40H300l-70 64 18-64h-68a40 40 0 0 1-40-40V500a40 40 0 0 1 40-40z" fill="#fbf9f4"/>
    <text x="220" y="560" fill="#20211a" font-family="Noto Serif SC, Songti SC, serif" font-size="48" font-weight="600">今晚 7 点，图书馆三楼，</text>
    <text x="220" y="622" fill="#20211a" font-family="Noto Serif SC, Songti SC, serif" font-size="48" font-weight="600">一起学吗？</text>

    <path d="M760 600h300a36 36 0 0 1 36 36v100a36 36 0 0 1-36 36H900l-60 56 12-56h-92a36 36 0 0 1-36-36V636a36 36 0 0 1 36-36z" fill="#20211a"/>
    <text x="800" y="700" fill="#fbf9f4" font-family="Noto Serif SC, Songti SC, serif" font-size="52" font-weight="600">走。</text>

    <circle cx="1010" cy="470" r="54" fill="#f0c75e"/>
    <text x="1010" y="489" text-anchor="middle" fill="#20211a" font-family="Cascadia Code, Consolas, monospace" font-size="26">21:00</text>
  </g>

  <text x="80" y="830" fill="#20211a" font-family="Cascadia Code, Consolas, monospace" font-size="15" opacity="0.6">24 INTERVIEWS · 3 ITERATIONS · 1 QUESTION</text>

  <rect width="1200" height="900" filter="url(#grain)" opacity="0.55"/>
</svg>
